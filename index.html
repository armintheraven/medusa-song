    g.fillRect(cx, top - rh - 7, scaleW * 0.08, 10);
    g.fillStyle = 'hsl(15,14%,20%)';
    g.fillRect(cx - 1.5, top - rh - 9, scaleW * 0.11, 3);
  }

  // windows (only detailed on closer layers)
  if (layer > 0.45) {
    const ww = scaleW * 0.12;
    const wh = h * 0.028 * layer;
    for (const q of b.win) {
      const wx = x + scaleW * q[0];
      const wy = top + h * 0.014 + q[1] * h * 0.07 * layer;

      g.fillStyle = 'hsla(35,20%,65%,0.4)';
      g.fillRect(wx - 1.5, wy - 1.5, ww + 3, wh + 3);

      g.fillStyle = q[2] ? 'hsla(38,88%,60%,0.9)' : 'hsl(220,22%,10%)';
      g.fillRect(wx, wy, ww, wh);

      if (q[2] && layer > 0.7) {
        g.fillStyle = 'hsla(30,15%,25%,0.35)';
        g.fillRect(wx + ww * 0.45, wy, ww * 0.1, wh);
        g.fillRect(wx, wy + wh * 0.45, ww, wh * 0.1);
      }
    }
  }

  // door (only front layer)
  if (layer > 0.8) {
    const dw = scaleW * 0.17;
    const dh = h * 0.048;
    const dx = x + scaleW * 0.42;
    g.fillStyle = 'hsl(25,28%,13%)';
    g.fillRect(dx, gy - dh, dw, dh);
    g.beginPath();
    g.arc(dx + dw / 2, gy - dh, dw / 2, Math.PI, 0);
    g.fill();
    g.fillStyle = 'hsl(42,40%,52%)';
    g.beginPath();
    g.arc(dx + dw * 0.75, gy - dh * 0.42, 1.4, 0, 6.283);
    g.fill();
  }

  g.restore();
}

function lamp(x, t, i) {
  const poleH = h * 0.11;
  const y = gy - poleH;
  const lv = 0.85 + 0.15 * Math.sin(t * 1.4 + (i % 3) * 2.1);

  // pole
  g.strokeStyle = 'hsl(220,8%,18%)';
  g.lineWidth = 2.5;
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(x, gy + 2);
  g.lineTo(x, y + 6);
  g.stroke();

  // lamp head
  g.fillStyle = 'hsl(30,15%,22%)';
  g.beginPath();
  g.moveTo(x - 5, y + 6);
  g.lineTo(x - 4, y - 2);
  g.lineTo(x + 4, y - 2);
  g.lineTo(x + 5, y + 6);
  g.closePath();
  g.fill();

  // light glow
  g.fillStyle = `hsla(42,95%,78%,${0.9 * lv})`;
  g.beginPath();
  g.arc(x, y + 1, 3.5, 0, 6.283);
  g.fill();
  glow(x, y + 2, h * 0.07, '42,90%,75%', 0.35 * lv);
}

/* ---------- Stick figures (improved) ---------- */
const ik = (ax, ay, tx, ty, l1, l2, s) => {
  const d = Math.min(Math.hypot(tx - ax, ty - ay), l1 + l2 - 0.001) || 0.001;
  const a = Math.atan2(ty - ay, tx - ax);
  const b = a + s * Math.acos(cl((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
  return [ax + Math.cos(b) * l1, ay + Math.sin(b) * l1, ax + Math.cos(a) * d, ay + Math.sin(a) * d];
};

/* Improved sitting poses — more natural hips & legs */
const STAND = [0, -0.46, 0, -0.06, 0, 0.06, 0, -0.05, -0.5, 0.05, -0.5];
const STEP  = [0.05, -0.46, 0.04, 0.17, -0.07, -0.04, 0, -0.05, -0.5, 0.05, -0.5];
const HUG   = [0, -0.46, 0.1, -0.06, 0, 0.06, 0, 0.24, -0.64, 0.24, -0.58];

/* Proper proposal kneel (matches the reference image) */
const KNEEL = [0, -0.32, 0.08,  0.22, 0.02,  -0.18, -0.02,   0.18, -0.78,  0.12, -0.42];

const JOY   = [0, -0.46, -0.02, -0.06, 0, 0.06, 0, 0.07, -0.66, 0.09, -0.62];

/* Sitting from behind / 3/4 rear view — better weight & leg placement */
const SITB = [0, -0.20, 0.12,  0.18, 0.04,  0.26, 0.02,  -0.08, -0.38,  0.16, -0.30];
const SITG = [0, -0.20, 0.38,  0.18, 0.04,  0.26, 0.02,   0.10, -0.26,  0.16, -0.22];

function fig(Q, x, y, K, d, c, lw, girl) {
  const L = (a, b) => [x + a * d * K, y + b * K];
  const hx = Q[0], hy = Q[1], ln = Q[2];
  const sx = hx + Math.sin(ln) * 0.3, sy = hy - Math.cos(ln) * 0.3;

  g.save();
  g.strokeStyle = g.fillStyle = c;
  g.lineWidth = lw;
  g.lineCap = g.lineJoin = 'round';

  const seg = a => {
    g.beginPath();
    a.forEach((q, i) => {
      const m = L(q[0], q[1]);
      i ? g.lineTo(m[0], m[1]) : g.moveTo(m[0], m[1]);
    });
    g.stroke();
  };

  // torso
  seg([[hx, hy], [sx, sy]]);

  // legs
  for (let i = 0; i < 2; i++) {
    const fx = Q[3 + 2 * i];
    const e = ik(hx, hy, fx, Q[4 + 2 * i], 0.23, 0.23, fx - hx < -0.18 ? 1 : -1);
    seg([[hx, hy], [e[0], e[1]], [e[2], e[3]]]);
  }

  // arms
  for (let i = 0; i < 2; i++) {
    const e = ik(sx, sy, Q[7 + 2 * i], Q[8 + 2 * i], 0.15, 0.15, 1);
    seg([[sx, sy], [e[0], e[1]], [e[2], e[3]]]);
  }

  // head
  const hl = [sx + Math.sin(ln) * 0.12, sy - Math.cos(ln) * 0.12 - 0.03];
  const m = L(hl[0], hl[1]);
  g.beginPath();
  g.arc(m[0], m[1], 0.105 * K, 0, 6.283);
  g.fill();

  // simple hair/skirt for girl
  if (girl) {
    seg([[hl[0] - 0.08, hl[1] - 0.02], [hl[0] - 0.19, hl[1] + 0.08]]);
    g.globalAlpha *= 0.5;
    const a = L(hx + Math.sin(ln) * 0.08, hy - 0.12);
    const b = L(hx - 0.14, hy + 0.08);
    const e = L(hx + 0.14, hy + 0.08);
    g.beginPath();
    g.moveTo(a[0], a[1]);
    g.lineTo(b[0], b[1]);
    g.lineTo(e[0], e[1]);
    g.fill();
  }
  g.restore();
}

function heart(x, y, s, a) {
  g.save();
  g.translate(x, y);
  g.scale(s, s);
  g.globalAlpha = a;
  g.shadowColor = 'hsl(350,100%,60%)';
  g.shadowBlur = 22;
  g.fillStyle = 'hsl(350,90%,62%)';
  g.beginPath();
  g.moveTo(0, 0.9);
  g.bezierCurveTo(-1.2, 0.1, -0.7, -0.9, 0, -0.35);
  g.bezierCurveTo(0.7, -0.9, 1.2, 0.1, 0, 0.9);
  g.fill();
  g.restore();
}

/* ---------- Characters ---------- */
function statue(t, ex) {
  const sx = w * (t < 40 ? 1.15 - 0.65 * eo((t - 32) / 8) : 0.5 - 0.36 * sm((t - 40) / 99)) - ex;
  if (sx > w + k || sx < -k) return;

  const ks = 0.8 * k, pb = 0.17 * k;
  const q = [0, -0.46, -0.03, -0.05, 0, 0.05, 0, 0.16, -0.84, -0.04, -0.48];
  const y = gy - pb - 0.025 * k;

  g.save();
  g.globalAlpha = 0.92;
  g.fillStyle = 'hsl(222,8%,31%)';
  g.fillRect(sx - 0.17 * k, gy - pb, 0.34 * k, pb);
  g.fillStyle = 'hsl(222,8%,41%)';
  g.fillRect(sx - 0.2 * k, gy - pb - 0.025 * k, 0.4 * k, 0.03 * k);
  fig(q, sx, y, ks, 1, 'hsl(220,8%,54%)', 0.075 * ks);
  g.restore();
}

function guitar(x, y, u, d) {
  g.save();
  g.translate(x, y);
  g.scale(d, 1);
  g.rotate(-0.5);
  const body = 'hsl(28,62%,40%)';
  g.fillStyle = body;
  g.strokeStyle = 'hsl(22,50%,18%)';
  g.lineWidth = 0.012 * u;
  g.beginPath(); g.arc(0, 0, 0.085 * u, 0, 6.283); g.fill(); g.stroke();
  g.beginPath(); g.arc(0.15 * u, 0, 0.062 * u, 0, 6.283); g.fill(); g.stroke();
  g.fillRect(0.05 * u, -0.045 * u, 0.1 * u, 0.09 * u);
  g.fillStyle = 'hsl(22,45%,14%)';
  g.beginPath(); g.arc(0, 0, 0.03 * u, 0, 6.283); g.fill();
  g.fillRect(-0.055 * u, -0.028 * u, 0.014 * u, 0.056 * u);
  g.fillRect(0.2 * u, -0.015 * u, 0.26 * u, 0.03 * u);
  g.fillRect(0.46 * u, -0.024 * u, 0.06 * u, 0.048 * u);
  g.strokeStyle = 'hsla(0,0%,90%,.7)';
  g.lineWidth = 0.003 * u;
  for (let i = -2.5; i <= 2.5; i++) {
    g.beginPath();
    g.moveTo(-0.05 * u, i * 0.0045 * u);
    g.lineTo(0.5 * u, i * 0.0045 * u);
    g.stroke();
  }
  g.fillStyle = 'hsl(40,20%,70%)';
  for (let i = 0; i < 3; i++) g.fillRect((0.28 + i * 0.07) * u, -0.015 * u, 0.004 * u, 0.03 * u);
  g.restore();
}

function guitarist(t, ex) {
  const x = w * (1.16 - 0.28 * eo((t - 73) / 66)) - ex;
  if (x > w + k || x < -k) return;

  const ks = 0.85 * k;
  const L = (a, b) => [x - a * ks, gy + b * ks];
  const st = Math.sin(t * 12) * 0.04 * (0.4 + env);

  glow(x, gy - 0.4 * ks, ks * 1.5, '38,90%,60%', 0.15);
  g.save();
  g.globalAlpha = 0.92;
  g.strokeStyle = 'hsl(30,25%,32%)';
  g.lineWidth = 0.03 * ks;
  g.lineCap = 'round';
  g.beginPath();
  [[[-0.1, -0.25], [0.1, -0.25]], [[-0.1, -0.25], [-0.1, -0.62]],
   [[-0.08, -0.25], [-0.08, 0]], [[0.08, -0.25], [0.08, 0]]].forEach(s => {
    const a = L(...s[0]), b = L(...s[1]);
    g.moveTo(a[0], a[1]);
    g.lineTo(b[0], b[1]);
  });
  g.stroke();
  fig([0, -0.27, -0.05, 0.22, 0, 0.15, 0, 0.12, -0.38 + st, 0.27, -0.55], x, gy, ks, -1, '#ffffff', 0.075 * ks);
  const c = L(0.12, -0.4);
  guitar(c[0], c[1], ks, -1);
  g.restore();
}

/* ========== Final sitting – clear readable stick figures ========== */
function drawSitPose(x, y, scale, color, isGirl, t, faceLeft) {
  const s = scale;
  const b = Math.sin(t * 0.85) * 0.005 * s;
  const dir = faceLeft ? -1 : 1;

  g.save();
  g.translate(x, y);
  g.scale(dir, 1);
  g.strokeStyle = color;
  g.fillStyle = color;
  g.lineWidth = Math.max(3.5, 0.085 * s); // thicker so they are actually visible
  g.lineCap = 'round';
  g.lineJoin = 'round';

  // Head
  g.beginPath();
  g.arc(0, -0.42 * s + b, 0.11 * s, 0, 6.283);
  g.fill();

  // Neck + torso
  g.beginPath();
  g.moveTo(0, -0.31 * s + b);
  g.lineTo(0, -0.06 * s + b);
  g.stroke();

  // Shoulders
  g.beginPath();
  g.moveTo(-0.14 * s, -0.28 * s + b);
  g.lineTo(0.14 * s, -0.28 * s + b);
  g.stroke();

  // Left arm (supporting)
  g.beginPath();
  g.moveTo(-0.14 * s, -0.28 * s + b);
  g.quadraticCurveTo(-0.24 * s, -0.10 * s, -0.18 * s, 0.08 * s);
  g.stroke();

  // Right arm
  g.beginPath();
  g.moveTo(0.14 * s, -0.28 * s + b);
  g.quadraticCurveTo(0.22 * s, -0.08 * s, 0.16 * s, 0.06 * s);
  g.stroke();

  // Left leg (bent)
  g.beginPath();
  g.moveTo(0, -0.06 * s + b);
  g.quadraticCurveTo(-0.18 * s, 0.04 * s, -0.10 * s, 0.14 * s);
  g.stroke();

  // Right leg (extended) – main feature of the reference
  g.beginPath();
  g.moveTo(0, -0.06 * s + b);
  g.quadraticCurveTo(0.25 * s, 0.02 * s, 0.36 * s, 0.12 * s);
  g.stroke();

  // Simple hair for girl
  if (isGirl) {
    g.beginPath();
    g.moveTo(-0.08 * s, -0.48 * s + b);
    g.quadraticCurveTo(-0.18 * s, -0.36 * s, -0.12 * s, -0.22 * s);
    g.moveTo(0.08 * s, -0.50 * s + b);
    g.quadraticCurveTo(0.18 * s, -0.38 * s, 0.12 * s, -0.24 * s);
    g.stroke();
  }

  g.restore();
}

function sit(t, x, y) {
  const gx = x - 0.22 * k;
  const bx = x + 0.12 * k;

  // Girl: soft pink, Boy: pure white
  drawSitPose(gx, y, k * 1.05, 'hsl(340,80%,78%)', true, t, true);
  drawSitPose(bx, y, k * 1.1, '#ffffff', false, t, false);
}

function couple(t, ex) {
  if (t < 128) return;

  const cx = w * 0.5, y = gy + 0.03 * h;
  const ar = 1 - eo((t - 130) / 8);
  const sh = (1.25 * w - cx) * ar - ex;

  // timing phases
  const approach = sm((t - 139) / 2);          // girl walks closer
  const hugPhase = sm((t - 143) / 1.4);        // brief hug
  const kneelPhase = sm((t - 147.2) / 2.2);    // boy goes down on one knee
  const heartPull = sm((t - 150.5) / 1.6);     // reaches into chest
  const offer = sm((t - 152.8) / 2.0);         // offers the heart

  const bx0 = cx - 0.12 * k;
  const gx0 = cx + 0.12 * k + 0.13 * k * (1 - approach);

  // boy pose: stand → hug → proper kneel
  let bp = mix(STAND, HUG, hugPhase);
  bp = mix(bp, KNEEL, kneelPhase);

  // girl pose
  let gp = mix(STAND, STEP, Math.sin(Math.PI * approach));
  gp = mix(gp, mix(HUG, JOY, offer * 0.7), hugPhase);

  const bxx = bx0 + (cx - 0.22 * k - bx0) * kneelPhase + sh;
  const gxx = gx0 + sh;

  glow(cx + sh, y - 0.45 * k, k * 1.3, '30,90%,60%', 0.13 * sm((t - 136) / 3));

  // draw girl then boy
  fig(gp, gxx, y, k, -1, 'hsl(340,90%,82%)', 0.075 * k, true);
  fig(bp, bxx, y, k, 1, '#ffffff', 0.075 * k);

  // Heart extraction & offering sequence
  if (t >= 150.2) {
    // start from boy's chest
    const chestX = bxx + 0.04 * k;
    const chestY = y - 0.38 * k;

    // hand reaches toward chest then extends to girl
    const handX = chestX + (gxx - 0.08 * k - chestX) * offer;
    const handY = chestY - 0.22 * k * offer - 0.05 * k * heartPull;

    // the heart itself
    const heartProgress = cl((t - 150.8) / 2.4);
    const hx = chestX + (handX - chestX) * heartProgress;
    const hy = chestY + (handY - chestY) * heartProgress - 0.04 * k * Math.sin(heartProgress * Math.PI);

    const heartSize = 0.055 * k * (0.4 + 0.6 * eo(heartProgress)) * (1 + 0.12 * env);
    const heartAlpha = cl(heartProgress * 1.8);

    if (heartAlpha > 0.05) {
      heart(hx, hy, heartSize, heartAlpha);
    }
  }

  // floating small hearts after the offer
  for (let i = 0; i < 6; i++) {
    const a = t - 155.5 - i * 0.28;
    if (a > 0 && a < 2.8) {
      const px = gxx + Math.sin(i * 1.7 + t) * 0.14 * k;
      const py = y - 0.75 * k - a * 0.2 * k;
      heart(px, py, 0.022 * k, (1 - a / 2.8) * 0.85);
    }
  }
}

/* ---------- Main render loop ---------- */
function frame(ts) {
  const dt = Math.min((ts - last) / 1000, 0.1);
  last = ts;

  if (!hasAudio && playing) {
    sim += dt;
    if (sim >= END) { sim = END; playing = false; ui(); }
  }
  if (hasAudio && tm && tp) {
    tail += dt;
    if (dur() + tail >= END) { tail = END - dur(); tp = false; ui(); }
  }

  const t = now();
  const pl = isPl();

  // color palette transition
  let s = 'i';
  for (const [a, q] of SECTIONS) if (t >= a) s = q;
  const T = PALETTE[s];
  const kk = 1 - Math.exp(-dt * 2.2);
  cur.h = (cur.h + (((T.h - cur.h + 540) % 360) - 180) * kk + 360) % 360;
  cur.fire += (T.fire - cur.fire) * kk;

  // audio reactive
  let hit = false;
  if (hasAudio && an && pl) {
    an.getByteFrequencyData(buf);
    let v = 0;
    for (let i = 1; i < 7; i++) v += buf[i];
    v /= 1530;
    pk = Math.max(v, pk * 0.9995);
    const n = v / (pk || 1);
    slow = slow * 0.94 + n * 0.06;
    if (n > slow * 1.2 && n > 0.55 && ts - lh > 250) { hit = true; lh = ts; }
    env = Math.max(env - dt * 3, n * n);
  } else if (!hasAudio && pl && t < 175) {
    const ph = t * 2;
    if (Math.floor(ph) !== Math.floor(pph)) hit = true;
    pph = ph;
    env = Math.max(env - dt * 3, hit ? 0.9 : 0);
  } else {
    env = Math.max(env - dt * 3, 0);
  }

  root.setProperty('--glow', col(60, 0.8));
  root.setProperty('--ac', col(68));

  const cm = cam(t);
  // smoother forest fade
  const fa = 1 - cl((t - 18) / 14);
  // City starts at 25s, fades in over ~5 seconds
  const cityStrength = cl((t - 25) / 5);
  const ex = t > 156 ? cm - c156 : 0;
  const bot = h * 0.67;

  // sky
  let gr = g.createLinearGradient(0, 0, 0, gy);
  gr.addColorStop(0, col(3));
  gr.addColorStop(1, col(12 + env * 3));
  g.fillStyle = gr;
  g.fillRect(0, 0, w, bot);

  // moon
  const mr = Math.min(w, h) * 0.035;
  glow(w * 0.8, h * 0.12, mr * 6, '48,60%,80%', 0.22);
  g.fillStyle = 'hsl(48,45%,90%)';
  g.beginPath();
  g.arc(w * 0.8, h * 0.12, mr, 0, 6.283);
  g.fill();

  // stars
  for (const o of stars) {
    g.fillStyle = `hsla(${cur.h | 0},20%,88%,${0.35 + 0.5 * Math.sin(t * 1.5 + o.p)})`;
    g.fillRect(o.x, o.y, o.s, o.s);
  }

  // soft atmospheric mist (moves slowly)
  g.save();
  g.globalAlpha = 0.07 + 0.04 * Math.sin(t * 0.15);
  for (let i = 0; i < 5; i++) {
    const mx = ((t * 8 + i * 180) % (w + 200)) - 100;
    const my = gy * 0.35 + i * h * 0.07;
    const mg = g.createRadialGradient(mx, my, 0, mx, my, 160 + i * 40);
    mg.addColorStop(0, 'hsla(250,30%,70%,0.5)');
    mg.addColorStop(1, 'hsla(250,30%,50%,0)');
    g.fillStyle = mg;
    g.fillRect(mx - 200, my - 100, 400, 200);
  }
  g.restore();

  // particles
  if (hit && cur.fire > 0.05 && Math.random() < cur.fire) {
    burst(w * (0.1 + Math.random() * 0.8), h * (0.04 + Math.random() * 0.24));
  }
  g.globalCompositeOperation = 'lighter';
  parts = parts.filter(o => o.l > 0);
  for (const o of parts) {
    o.vy += 130 * dt;
    o.x += o.vx * dt;
    o.y += o.vy * dt;
    o.vx *= 0.985;
    o.l -= dt * 0.7;
    g.fillStyle = `hsla(${o.h | 0},70%,65%,${Math.max(o.l, 0)})`;
    g.beginPath();
    g.arc(o.x, o.y, 1.8 * o.l + 0.4, 0, 6.283);
    g.fill();
  }
  g.globalCompositeOperation = 'source-over';

  // forest
  if (fa > 0.01) {
    [0, 1, 2].forEach(l => {
      g.fillStyle = col(5 + (2 - l) * 3, fa * (0.6 + 0.2 * l));
      for (const o of forest[l]) {
        pine(((o.x - cm * [0.25, 0.5, 1][l]) % Pw + Pw) % Pw - 0.2 * w, gy + 0.02 * h, o.H,
          Math.sin(t * 1.3 + o.x) * (0.012 + 0.02 * env));
      }
    });
  }

  // ---------- CITY – appears after 25s, stays until ~156, then slowly disappears ----------
  const mm = t > 156;
  // city takes longer to fully disappear so we don't jump to lake
  const cityFade = mm ? 1 - cl((t - 156) / 7) : 1;

  if (t >= 27 && cityFade > 0.02) {
    g.save();
    // City enters from the right edge (no fade-from-transparent)
    // It slides in from outside the screen as forest ends
    const enterT = cl((t - 27) / 4.5);
    const ease = enterT * enterT * (3 - 2 * enterT);
    const slide = (1 - ease) * w * 0.55; // starts fully off-screen to the right
    g.globalAlpha = cityFade; // only fades out later when going to lake
    g.translate(slide, 0);

    // far layer (smaller, darker, slower parallax)
    for (const b of bl) {
      if (b.i % 3 !== 0) continue;
      const x = b.x * 0.55 + c22 * 0.6 + w * 0.2 - cm * 0.45;
      if (x > w + 40 || x + b.w < -40) continue;
      house(b, x, 0.4);
    }

    // mid layer
    for (const b of bl) {
      if (b.i % 2 === 0) continue;
      const x = b.x * 0.8 + c22 * 0.85 + w * 0.1 - cm * 0.75;
      if (x > w + 20 || x + b.w < -20) continue;
      house(b, x, 0.7);
    }

    // front layer (full detail)
    for (const b of bl) {
      const x = b.x + c22 + w - cm;
      b.sx = x;
      if (x > w || x + b.w < 0) continue;
      house(b, x, 1);
    }

    // street lamps only on front
    for (const b of bl) {
      if (b.lamp && b.sx < w && b.sx + b.w > -10) lamp(b.sx + b.w + 5, t, b.i);
    }
    g.restore();
  }

  // ground under city
  gr = g.createLinearGradient(0, gy, 0, bot);
  gr.addColorStop(0, col(8));
  gr.addColorStop(1, col(4));
  g.fillStyle = gr;
  g.fillRect(0, gy, w, bot - gy);

  // ========== LAKE SCENE – sequential: city out → grass → lake → characters ==========
  if (mm) {
    // phases:
    // 156-162 : city still fading, grass starts
    // 162-168 : grass full, lake starts appearing
    // 168+    : lake + characters
    const grassIn = cl((t - 157) / 5);
    const lakeIn  = cl((t - 162) / 5);
    const enter   = cl((t - 156) / 8);

    // distant hills
    if (grassIn > 0.02) {
      g.save();
      g.globalAlpha = grassIn;
      const hillBase = gy - 0.18 * h + enter * 0.03 * h;
      g.fillStyle = col(6);
      g.beginPath();
      g.moveTo(0, hillBase);
      for (let x = 0; x <= w; x += 18) {
        const n = Math.sin(x * 0.008 + 1.2) * 0.5 + Math.sin(x * 0.019) * 0.3;
        g.lineTo(x, hillBase - 0.045 * h * (0.55 + 0.45 * n));
      }
      g.lineTo(w, gy);
      g.lineTo(0, gy);
      g.fill();
      g.restore();
    }

    // lake surface (appears after grass)
    if (lakeIn > 0.02) {
      g.save();
      g.globalAlpha = lakeIn;
      const lakeTop = gy - 0.07 * h - enter * 0.025 * h;
      const lakeBot = gy + 0.02 * h;
      gr = g.createLinearGradient(0, lakeTop, 0, lakeBot);
      gr.addColorStop(0, 'hsla(210,45%,22%,0.85)');
      gr.addColorStop(0.6, 'hsla(200,40%,16%,0.9)');
      gr.addColorStop(1, 'hsla(195,35%,12%,0.95)');
      g.fillStyle = gr;
      g.fillRect(0, lakeTop, w, lakeBot - lakeTop);

      // moon reflection
      g.fillStyle = 'hsla(48,60%,85%,0.25)';
      for (let i = 0; i < 11; i++) {
        const yy = lakeTop + (i + 0.5) * (lakeBot - lakeTop) / 11;
        const ww = (5 + i * 2.5) * (0.7 + 0.3 * Math.sin(t * 1.3 + i));
        g.fillRect(w * 0.78 - ww / 2, yy, ww, 1.4);
      }
      g.restore();
    }

    // meadow
    const meadowTop = gy + 0.02 * h;
    if (grassIn > 0.02) {
      g.save();
      g.globalAlpha = grassIn;
      gr = g.createLinearGradient(0, meadowTop, 0, bot);
      gr.addColorStop(0, 'hsl(135,30%,16%)');
      gr.addColorStop(1, 'hsl(140,28%,9%)');
      g.fillStyle = gr;
      g.fillRect(0, meadowTop, w, bot - meadowTop);
      g.restore();
    }

    // flowers
    const flowerAlpha = cl((t - 159) / 4) * grassIn;
    if (flowerAlpha > 0.05) {
      g.globalAlpha = flowerAlpha;
      for (const f of flw) {
        // remap x so flowers feel like they come from depth
        const depth = f.y; // 0 = far, 1 = near
        const px = (f.x / (D + w * 1.2)) * w * 1.1 - w * 0.05;
        const py = meadowTop + 8 + depth * (bot - meadowTop - 20);
        const size = f.s * (0.6 + depth * 0.9);

        g.strokeStyle = 'hsl(135,40%,22%)';
        g.lineWidth = 1;
        g.beginPath();
        g.moveTo(px, py);
        g.lineTo(px, py + size * 2.2);
        g.stroke();

        g.fillStyle = `hsl(${f.hu},80%,${f.hu === 50 ? 62 : 70}%)`;
        g.beginPath();
        g.arc(px, py, size * (0.85 + 0.15 * Math.sin(t * 2.1 + f.x)), 0, 6.283);
        g.fill();
      }
      g.globalAlpha = 1;
    }
  }

  // bottom gradient for lyrics
  gr = g.createLinearGradient(0, bot, 0, bot + h * 0.06);
  gr.addColorStop(0, col(5));
  gr.addColorStop(1, col(2));
  g.fillStyle = gr;
  g.fillRect(0, bot, w, h - bot);

  // characters – statue & guitarist only while city is visible
  if (!mm || cityFade > 0.15) {
    statue(t, ex);
    guitarist(t, ex);
  }
  if (t < 156 + 5) couple(t, ex);

  // lake characters + fireflies + shooting star
  if (mm) {
    // characters appear only after grass + lake are mostly visible
    const appear = cl((t - 165) / 3);

    if (appear > 0.05) {
      g.save();
      g.globalAlpha = appear;
      const pairX = w * 0.5;
      const pairY = gy + 0.05 * h;
      sit(t, pairX, pairY);
      g.restore();
    }

    // fireflies
    g.globalCompositeOperation = 'lighter';
    const fo = sm((t - 159) / 3.5);
    for (const o of ff) {
      const a = Math.pow(Math.max(0, Math.sin(t * o.f + o.p)), 4) * fo;
      if (a < 0.02) continue;
      const x = o.x * 0.9 + w * 0.05 + Math.sin(t * 0.4 + o.p) * 16;
      const y = o.y * 0.7 + h * 0.25 + Math.cos(t * 0.5 + o.p) * 10;
      glow(x, y, 11, '66,100%,62%', 0.55 * a);
      g.fillStyle = `hsla(66,100%,80%,${a})`;
      g.fillRect(x - 1.2, y - 1.2, 2.4, 2.4);
    }

    // shooting star
    const starT = t - 163;
    if (starT > 0 && starT < 3.0) {
      const progress = starT / 3.0;
      const sx0 = w * 0.12 + progress * w * 0.75;
      const sy0 = h * 0.10 + progress * h * 0.22;
      const trail = 22 + progress * 38;

      g.strokeStyle = `hsla(48,100%,88%,${0.95 - progress * 0.75})`;
      g.lineWidth = 2.4;
      g.lineCap = 'round';
      g.beginPath();
      g.moveTo(sx0, sy0);
      g.lineTo(sx0 - trail * 0.75, sy0 - trail * 0.32);
      g.stroke();

      glow(sx0, sy0, 16, '48,100%,82%', 0.75 * (1 - progress));
      g.fillStyle = `hsla(50,100%,96%,${0.98 - progress * 0.6})`;
      g.beginPath();
      g.arc(sx0, sy0, 2.6, 0, 6.283);
      g.fill();
    }

    g.globalCompositeOperation = 'source-over';
  }

  // vignette
  gr = g.createRadialGradient(w / 2, h * 0.4, Math.min(w, h) * 0.3, w / 2, h * 0.4, Math.max(w, h) * 0.8);
  gr.addColorStop(0, 'rgba(0,0,0,0)');
  gr.addColorStop(1, 'rgba(0,0,0,.5)');
  g.fillStyle = gr;
  g.fillRect(0, 0, w, h);

  // lyrics update
  let i = -1;
  for (let j = 0; j < lines.length; j++) if (t >= lines[j].t - 1.25) i = j;
  if (i !== idx) mark(i);

  rg.max = END;
  document.body.classList.toggle('fin', t >= 176);
  document.body.classList.toggle('dl', t >= 182);
  if (!drag) rg.value = t;
  $('#tm').textContent = fmt(t);

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
